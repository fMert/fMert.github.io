server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    location / { try_files $uri $uri/ =404; }
    location = /reset-site.html {
        add_header Clear-Site-Data '"cache", "storage"' always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:css|js)$ {
        expires -1;
        try_files $uri =404;
    }
}
